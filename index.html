<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualisations</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --text: #202124;
      --muted: #666b73;
      --line: #d9ded8;
      --accent: #246b5a;
      --accent-dark: #17483d;
      --draft-bg: #fff1d6;
      --draft-text: #835000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding: 32px 0 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: 0;
    }


    .count {
      flex: 0 0 auto;
      color: var(--muted);
      font-weight: 600;
    }

    main {
      padding: 24px 0 48px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      display: flex;
      min-height: 0;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 18px;
      text-decoration: none;
      color: inherit;
      transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .card:hover,
    .card:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(32, 33, 36, 0.08);
      transform: translateY(-2px);
      outline: none;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 0.78rem;
      font-weight: 750;
      text-transform: uppercase;
    }

    .category {
      background: #e9eef6;
      color: #244466;
    }


    .chapter {
      background: #f0ece4;
      color: #5a4a33;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .filter-row label {
      color: var(--muted);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .filter-row select {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 0.92rem;
      padding: 7px 30px 7px 12px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23666b73' stroke-width='1.6'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 11px;
      cursor: pointer;
    }

    .filter-row select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .brouillon {
      background: var(--draft-bg);
      color: var(--draft-text);
    }

    h2 {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.25;
      letter-spacing: 0;
    }



    .empty {
      display: none;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 28px;
      background: var(--panel);
      color: var(--muted);
    }

    @media (max-width: 680px) {
      .top {
        display: block;
      }

      .count {
        margin-top: 14px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap top">
      <div>
        <h1>Visualisations</h1>
      </div>
      <div class="count" id="count"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="filters" aria-label="Filtres">
      <div class="filter-row">
        <label for="fYear">Classe</label>
        <select id="fYear"></select>
        <label for="fChapter">Chapitre</label>
        <select id="fChapter"></select>
      </div>
    </section>

    <section class="grid" id="grid" aria-live="polite"></section>
    <p class="empty" id="empty">Aucune visualisation ne correspond aux filtres.</p>
  </main>

  <script src="visualisations.js"></script>
  <script>
    const state = {
      year: "all",
      chapter: "all",
      items: []
    };

    const grid = document.querySelector("#grid");
    const count = document.querySelector("#count");
    const empty = document.querySelector("#empty");
    const selYear = document.querySelector("#fYear");
    const selChapter = document.querySelector("#fChapter");

    const publie = (item) => item.status !== "non-publie";

    function visibleItems() {
      return state.items.filter(publie).filter((item) => {
        const yearOk = state.year === "all" || item.category === state.year;
        const chapterOk = state.chapter === "all" || (item.chapter || "") === state.chapter;
        return yearOk && chapterOk;
      });
    }

    function fillSelect(select, group, values, tousLabel) {
      if (!values.includes(state[group])) {
        state[group] = "all";
      }
      select.innerHTML = ["all", ...values].map((value) => `
        <option value="${value}" ${value === state[group] ? "selected" : ""}>
          ${value === "all" ? tousLabel : value}
        </option>
      `).join("");
      select.disabled = values.length === 0;
    }

    function refresh() {
      const items = state.items.filter(publie);
      const years = [...new Set(items.map((item) => item.category))]
        .sort((a, b) => a.localeCompare(b, "fr"));
      const chapters = [...new Set(items
        .filter((item) => state.year === "all" || item.category === state.year)
        .map((item) => item.chapter)
        .filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr"));

      fillSelect(selYear, "year", years, "Toutes");
      fillSelect(selChapter, "chapter", chapters, "Tous");
      render();
    }

    function render() {
      const items = visibleItems();
      const publicTotal = state.items.filter(publie).length;
      grid.innerHTML = items.map((item) => `
        <a class="card" href="${item.path}">
          <div class="meta">
            <span class="tag category">${item.category}</span>
            ${item.chapter ? `<span class="tag chapter">${item.chapter}</span>` : ""}
            ${item.status === "brouillon" ? `<span class="tag brouillon">Brouillon</span>` : ""}
          </div>
          <h2>${item.title}</h2>
        </a>
      `).join("");
      count.textContent = `${items.length} / ${publicTotal}`;
      empty.style.display = items.length ? "none" : "block";
    }

    selYear.addEventListener("change", () => {
      state.year = selYear.value;
      state.chapter = "all";
      refresh();
    });

    selChapter.addEventListener("change", () => {
      state.chapter = selChapter.value;
      render();
    });

    const chargerCatalogue = () => {
      if (Array.isArray(window.CATALOGUE)) {
        return Promise.resolve(window.CATALOGUE);
      }
      return fetch("visualisations.json").then((response) => {
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        return response.json();
      });
    };

    chargerCatalogue()
      .then((items) => {
        state.items = items.sort((a, b) => {
          return a.category.localeCompare(b.category, "fr")
            || (a.chapter || "").localeCompare(b.chapter || "", "fr")
            || a.title.localeCompare(b.title, "fr");
        });
        refresh();
      })
      .catch((error) => {
        grid.innerHTML = "";
        count.textContent = "Erreur";
        empty.textContent = `Impossible de charger visualisations.json: ${error.message}`;
        empty.style.display = "block";
      });
  </script>
</body>
</html>
