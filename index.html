<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualisations</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --text: #202124;
      --muted: #666b73;
      --line: #d9ded8;
      --accent: #246b5a;
      --accent-dark: #17483d;
      --draft-bg: #fff1d6;
      --draft-text: #835000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding: 32px 0 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: 0;
    }


    .count {
      flex: 0 0 auto;
      color: var(--muted);
      font-weight: 600;
    }

    main {
      padding: 24px 0 48px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    thead th {
      text-align: left;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr {
      cursor: pointer;
    }

    tbody tr:hover,
    tbody tr:focus-within {
      background: #f1f4ef;
    }

    tbody a {
      color: inherit;
      text-decoration: none;
      font-weight: 650;
    }

    tbody tr:hover a {
      color: var(--accent);
    }

    td.secondaire {
      color: var(--muted);
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 750;
      text-transform: uppercase;
    }

    td .tag {
      margin-left: 8px;
      vertical-align: 1px;
    }

    .brouillon {
      background: var(--draft-bg);
      color: var(--draft-text);
    }

    .empty {
      display: none;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 28px;
      background: var(--panel);
      color: var(--muted);
    }

    @media (max-width: 680px) {
      .top {
        display: block;
      }

      .count {
        margin-top: 14px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap top">
      <div>
        <h1>Visualisations</h1>
      </div>
      <div class="count" id="count"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="filters" aria-label="Filtres">
      <div class="filter-row">
        <label for="fYear">Classe</label>
        <select id="fYear"></select>
        <label for="fChapter">Chapitre</label>
        <select id="fChapter"></select>
      </div>
    </section>

    <table id="liste" aria-live="polite">
      <thead>
        <tr><th>Visualisation</th><th>Classe</th><th>Chapitre</th></tr>
      </thead>
      <tbody id="corps"></tbody>
    </table>
    <p class="empty" id="empty">Aucune visualisation ne correspond aux filtres.</p>
  </main>

  <script src="visualisations.js"></script>
  <script>
    const state = {
      year: "all",
      chapter: "all",
      items: []
    };

    const corps = document.querySelector("#corps");
    const liste = document.querySelector("#liste");
    const count = document.querySelector("#count");
    const empty = document.querySelector("#empty");
    const selYear = document.querySelector("#fYear");
    const selChapter = document.querySelector("#fChapter");

    const publie = (item) => item.status !== "non-publie";

    function visibleItems() {
      return state.items.filter(publie).filter((item) => {
        const yearOk = state.year === "all" || item.category === state.year;
        const chapterOk = state.chapter === "all" || (item.chapter || "") === state.chapter;
        return yearOk && chapterOk;
      });
    }

    function fillSelect(select, group, values, tousLabel) {
      if (!values.includes(state[group])) {
        state[group] = "all";
      }
      select.innerHTML = ["all", ...values].map((value) => `
        <option value="${value}" ${value === state[group] ? "selected" : ""}>
          ${value === "all" ? tousLabel : value}
        </option>
      `).join("");
      select.disabled = values.length === 0;
    }

    function refresh() {
      const items = state.items.filter(publie);
      const years = [...new Set(items.map((item) => item.category))]
        .sort((a, b) => a.localeCompare(b, "fr"));
      const chapters = [...new Set(items
        .filter((item) => state.year === "all" || item.category === state.year)
        .map((item) => item.chapter)
        .filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr"));

      fillSelect(selYear, "year", years, "Toutes");
      fillSelect(selChapter, "chapter", chapters, "Tous");
      render();
    }

    function render() {
      const items = visibleItems();
      const publicTotal = state.items.filter(publie).length;
      corps.innerHTML = items.map((item) => `
        <tr data-path="${item.path}" tabindex="0">
          <td>
            <a href="${item.path}">${item.title}</a>
            ${item.status === "brouillon" ? `<span class="tag brouillon">Brouillon</span>` : ""}
          </td>
          <td class="secondaire">${item.category}</td>
          <td class="secondaire">${item.chapter || ""}</td>
        </tr>
      `).join("");
      count.textContent = `${items.length} / ${publicTotal}`;
      liste.style.display = items.length ? "" : "none";
      empty.style.display = items.length ? "none" : "block";
    }

    corps.addEventListener("click", (event) => {
      if (event.target.closest("a")) {
        return;
      }
      const ligne = event.target.closest("tr[data-path]");
      if (ligne) {
        window.location.href = ligne.dataset.path;
      }
    });

    corps.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") {
        return;
      }
      const ligne = event.target.closest("tr[data-path]");
      if (ligne) {
        event.preventDefault();
        window.location.href = ligne.dataset.path;
      }
    });

    selYear.addEventListener("change", () => {
      state.year = selYear.value;
      state.chapter = "all";
      refresh();
    });

    selChapter.addEventListener("change", () => {
      state.chapter = selChapter.value;
      render();
    });

    const chargerCatalogue = () => {
      if (Array.isArray(window.CATALOGUE)) {
        return Promise.resolve(window.CATALOGUE);
      }
      return fetch("visualisations.json").then((response) => {
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        return response.json();
      });
    };

    chargerCatalogue()
      .then((items) => {
        state.items = items.sort((a, b) => {
          return a.category.localeCompare(b.category, "fr")
            || (a.chapter || "").localeCompare(b.chapter || "", "fr")
            || a.title.localeCompare(b.title, "fr");
        });
        refresh();
      })
      .catch((error) => {
        corps.innerHTML = "";
        liste.style.display = "none";
        count.textContent = "Erreur";
        empty.textContent = `Impossible de charger visualisations.json: ${error.message}`;
        empty.style.display = "block";
      });
  </script>
</body>
</html>
