<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esquisser f′ à partir du graphe de f</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#1f2933;--muted:#6b7785;--accent:#2563eb;--line:#dde3ea;--or:#c98a06}
  *{box-sizing:border-box}
  body{margin:0;padding:24px 16px 40px;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:1.5rem;margin:0 0 18px;text-align:center;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
  .deux{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.deux{grid-template-columns:1fr}}
  .b{width:100%;aspect-ratio:1/1;border-radius:10px;border:1px solid var(--line);background:#fff;touch-action:none}
  .row{display:flex;align-items:center;gap:12px;margin:16px 0 0}
  .row label{min-width:78px;font-size:.92rem;color:var(--muted)}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .val{min-width:96px;text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;
       font-weight:700;color:var(--accent)}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;
         padding:7px 12px;font:inherit;font-size:.88rem;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .mes{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:.92rem;color:var(--muted)}
  .mes b{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
  .src{margin-top:16px;font-size:.85rem;color:var(--muted);text-align:center}
  .src a{color:var(--accent)}
  .retour{display:inline-block;margin:0 0 14px;font-size:.88rem;color:var(--muted);text-decoration:none}
  .retour:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <a class="retour" href="../../../index.html">← Retour au catalogue</a>
  <h1>Esquisser f′ à partir du graphe de f</h1>
  <div class="card">
    <div class="btns" style="margin:0 0 14px" id="choix">
      <button data-k="a" class="on">a</button>
      <button data-k="b">b</button>
      <button data-k="c">c</button>
      <button data-k="d">d</button>
    </div>
    <div class="deux">
      <div id="bf" class="b"></div>
      <div id="bd" class="b"></div>
    </div>

    <div class="row">
      <label for="param">x</label>
      <input type="range" id="param" min="0" max="5" step="0.01" value="0.5">
      <span class="val" id="paramVal">0,50</span>
    </div>

    <div class="mes">
      <span>f(x) = <b id="mf"></b></span>
      <span>pente de la tangente = <b id="mp"></b></span>
    </div>

    <div class="btns">
      <button id="play">Animer</button>
      <button id="tout">Afficher f′ en entier</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var BLEU = '#2563eb', VERT = '#059669', OR = '#c98a06';

  var FONCTIONS = {
    a: {
      f: function (x) { return x <= 1 ? x : (x <= 3 ? 1 : 1 - (x - 3) / 2); },
      d: function (x) { return x < 1 ? 1 : (x < 3 ? 0 : -0.5); },
      dom: [0, 5], morceaux: [[0, 1], [1, 3], [3, 5]], cassures: [1, 3],
      boxF: [-0.4, 1.5, 5.4, -0.4], boxD: [-0.4, 1.5, 5.4, -1]
    },
    b: {
      f: function (x) { return 1 / (1 + x * x); },
      d: function (x) { return -2 * x / Math.pow(1 + x * x, 2); },
      dom: [-2.5, 2.5], morceaux: [[-2.5, 2.5]], cassures: [],
      boxF: [-2.7, 1.3, 2.7, -0.3], boxD: [-2.7, 0.8, 2.7, -0.8]
    },
    c: {
      f: function (x) { return x * x - 1; },
      d: function (x) { return 2 * x; },
      dom: [-1.6, 1.6], morceaux: [[-1.6, 1.6]], cassures: [],
      boxF: [-1.8, 2, 1.8, -1.5], boxD: [-1.8, 3.5, 1.8, -3.5]
    },
    d: {
      f: function (x) { return Math.sqrt(Math.max(0, 1 - x * x)); },
      d: function (x) { return -x / Math.sqrt(Math.max(1e-12, 1 - x * x)); },
      dom: [-1, 1], morceaux: [[-1, 1]], cassures: [],
      boxF: [-1.2, 1.3, 1.2, -0.3], boxD: [-1.2, 3.2, 1.2, -3.2]
    }
  };

  function fmt(v) { return v.toFixed(2).replace('.', ',').replace('-', '−'); }
  function arrondi(v) {
    return (Math.abs(v - Math.round(v * 100) / 100) < 5e-13 ? '' : '≈ ') + fmt(v);
  }

  function creer(id) {
    return JXG.JSXGraph.initBoard(id, {
      boundingbox: [-1, 1, 1, -1], keepaspectratio: false, axis: true,
      showCopyright: false, showNavigation: false, pan: {enabled: false}, zoom: {enabled: false}
    });
  }
  var bf = creer('bf'), bd = creer('bd');

  var cle = 'a', F = FONCTIONS.a, X = 0.5, tout = false;

  var courbeF = bf.create('curve', [[], []], {strokeColor: BLEU, strokeWidth: 3, highlight: false});
  var courbeD = bd.create('curve', [[], []], {strokeColor: VERT, strokeWidth: 3, highlight: false});
  var courbeDt = bd.create('curve', [[], []], {strokeColor: VERT, strokeWidth: 2, dash: 2,
    opacity: 0.45, highlight: false, visible: false});

  var P = bf.create('point', [0, 0], {name: '', size: 6, fillColor: OR, strokeColor: OR,
    showInfobox: false});
  var Q = bd.create('point', [0, 0], {name: '', size: 6, fillColor: VERT, strokeColor: VERT,
    fixed: true, highlight: false});
  var T1 = bf.create('point', [0, 0], {visible: false, name: ''});
  var tangente = bf.create('line', [P, T1], {strokeColor: OR, strokeWidth: 2, dash: 2,
    straightFirst: true, straightLast: true, highlight: false});
  var vf = bf.create('segment', [P, [function () { return X; }, 0]],
    {strokeColor: '#9aa5b1', dash: 3, strokeWidth: 1, highlight: false});
  var vd = bd.create('segment', [Q, [function () { return X; }, 0]],
    {strokeColor: '#9aa5b1', dash: 3, strokeWidth: 1, highlight: false});

  var creux = [];
  for (var i = 0; i < 6; i++) {
    creux.push(bd.create('point', [0, 0], {name: '', size: 4, fillColor: '#fff',
      strokeColor: VERT, fixed: true, visible: false, highlight: false}));
  }

  var legF = bf.create('text', [function () { return bf.getBoundingBox()[0] + 0.03 * (bf.getBoundingBox()[2] - bf.getBoundingBox()[0]); },
    function () { return bf.getBoundingBox()[1] - 0.1 * (bf.getBoundingBox()[1] - bf.getBoundingBox()[3]); }, 'f'],
    {fontSize: 18, color: BLEU, fixed: true});
  var legD = bd.create('text', [function () { return bd.getBoundingBox()[0] + 0.03 * (bd.getBoundingBox()[2] - bd.getBoundingBox()[0]); },
    function () { return bd.getBoundingBox()[1] - 0.1 * (bd.getBoundingBox()[1] - bd.getBoundingBox()[3]); }, 'f′'],
    {fontSize: 18, color: VERT, fixed: true});

  var elParam = document.getElementById('param'),
      elPlay = document.getElementById('play'),
      elTout = document.getElementById('tout');

  function echantillon(g, a, b, n) {
    var xs = [], ys = [];
    for (var i = 0; i <= n; i++) {
      var x = a + (b - a) * i / n;
      xs.push(x); ys.push(g(x));
    }
    return [xs, ys];
  }

  // f' sur les morceaux de f' ; arret en x (ou fin du domaine si x = null).
  function dataDerivee(jusqua) {
    var xs = [], ys = [], eps = 1e-4, premier = true;
    F.morceaux.forEach(function (m) {
      var a = m[0] + eps, b = Math.min(m[1] - eps, jusqua === null ? Infinity : jusqua);
      if (b <= a) return;
      if (!premier) { xs.push(NaN); ys.push(NaN); }
      premier = false;
      var s = echantillon(F.d, a, b, Math.max(2, Math.round(240 * (b - a) / (F.dom[1] - F.dom[0]))));
      xs = xs.concat(s[0]); ys = ys.concat(s[1]);
    });
    return [xs, ys];
  }

  function cassure(x) {
    return F.cassures.some(function (c) { return Math.abs(x - c) < 1e-9; });
  }

  function render() {
    var f = F.f(X), indefinie = cassure(X), m = F.d(X);
    document.getElementById('paramVal').textContent = fmt(X);
    document.getElementById('mf').textContent = arrondi(f);
    document.getElementById('mp').textContent = indefinie ? 'non définie' : arrondi(m);

    bf.suspendUpdate(); bd.suspendUpdate();
    P.setPosition(JXG.COORDS_BY_USER, [X, f]);
    T1.setPosition(JXG.COORDS_BY_USER, [X + 1, f + (indefinie ? 0 : m)]);
    tangente.setAttribute({visible: !indefinie});
    Q.setPosition(JXG.COORDS_BY_USER, [X, indefinie ? 0 : m]);
    Q.setAttribute({visible: !indefinie});
    vd.setAttribute({visible: !indefinie});

    var d = dataDerivee(X);
    courbeD.dataX = d[0]; courbeD.dataY = d[1];

    F.morceaux.forEach(function (mo, k) {
      var a = mo[0], b = mo[1];
      var ya = F.d(a + 1e-4), yb = F.d(b - 1e-4);
      var pa = creux[2 * k], pb = creux[2 * k + 1];
      pa.setPosition(JXG.COORDS_BY_USER, [a, ya]);
      pb.setPosition(JXG.COORDS_BY_USER, [b, yb]);
      pa.setAttribute({visible: F.cassures.length > 0 && (tout || X > a)});
      pb.setAttribute({visible: F.cassures.length > 0 && (tout || X >= b)});
    });
    bf.unsuspendUpdate(); bd.unsuspendUpdate();
  }

  function choisir(k) {
    cle = k; F = FONCTIONS[k];
    var lo = F.dom[0], hi = F.dom[1];
    if (k === 'd') { lo = -0.99; hi = 0.99; }
    elParam.min = lo; elParam.max = hi;
    X = Math.round(((lo + hi) / 2 + (hi - lo) * 0.08) * 100) / 100;
    elParam.value = X;

    bf.setBoundingBox(F.boxF, false); bd.setBoundingBox(F.boxD, false);
    var s = echantillon(F.f, F.dom[0], F.dom[1], 300);
    courbeF.dataX = s[0]; courbeF.dataY = s[1];
    var d = dataDerivee(null);
    courbeDt.dataX = d[0]; courbeDt.dataY = d[1];
    for (var i = 0; i < creux.length; i++) creux[i].setAttribute({visible: false});
    var bt = document.querySelectorAll('#choix button');
    for (var j = 0; j < bt.length; j++) bt[j].classList.toggle('on', bt[j].dataset.k === k);
    render();
    bf.update(); bd.update();
  }

  P.on('drag', function () {
    var lo = parseFloat(elParam.min), hi = parseFloat(elParam.max);
    X = Math.min(hi, Math.max(lo, Math.round(P.X() * 100) / 100));
    elParam.value = X;
    render();
  });
  elParam.addEventListener('input', function () { X = parseFloat(elParam.value); render(); });

  document.getElementById('choix').addEventListener('click', function (e) {
    if (e.target.dataset.k) choisir(e.target.dataset.k);
  });

  elTout.addEventListener('click', function () {
    tout = !tout;
    elTout.classList.toggle('on', tout);
    courbeDt.setAttribute({visible: tout});
    render();
  });

  var timer = null;
  elPlay.addEventListener('click', function () {
    if (timer) {
      clearInterval(timer); timer = null;
      elPlay.textContent = 'Animer'; elPlay.classList.remove('on');
      return;
    }
    elPlay.textContent = 'Arrêter'; elPlay.classList.add('on');
    timer = setInterval(function () {
      var lo = parseFloat(elParam.min), hi = parseFloat(elParam.max);
      var t = X + (hi - lo) / 250;
      if (t > hi) t = lo;
      X = Math.round(t * 1000) / 1000;
      elParam.value = X;
      render();
    }, 40);
  });

  choisir('a');
})();
</script>
</body>
</html>
